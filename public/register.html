<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนผู้ป่วยใหม่ - MEDPRO CLINIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e; /* Teal 700 */
            --primary-light: #14b8a6; /* Teal 500 */
            --primary-bg: #f0fdfa; /* Teal 50 */
            --dark-text: #1e293b;
            --light-text: #64748b;
            --white: #ffffff;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background-color: #f8fafc;
            color: var(--dark-text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header i {
            color: var(--primary-light);
            filter: drop-shadow(0 0 10px rgba(20, 184, 166, 0.3));
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 700;
        }

        .header p {
            color: var(--light-text);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1.5px solid var(--gray-200);
        }

        .form-section h3 {
            font-size: 1.05rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section h3 i {
            color: var(--primary-light);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 15px;
        }

        .col-2 { grid-column: span 2; }
        .col-3 { grid-column: span 3; }
        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group.required label::after {
            content: ' *';
            color: var(--danger);
            font-weight: bold;
        }

        input[type="text"], 
        input[type="number"], 
        input[type="tel"], 
        select, 
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            background-color: var(--white);
            color: var(--dark-text);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        .warning-toast {
            background-color: #fee2e2;
            border-left: 4px solid var(--danger);
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 10px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(15, 118, 110, 0.2);
            margin-top: 15px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.success {
            background-color: #e6fcf5;
            color: #0ca678;
            border: 1px solid #c3fae8;
        }

        .status.error {
            background-color: #fff5f5;
            color: #f03e3e;
            border: 1px solid #ffe3e3;
        }

        .link-admin {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .link-admin:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="fas fa-hospital-user fa-3x"></i>
        <h1>ระบบลงทะเบียนประวัติผู้ป่วยใหม่</h1>
        <p>MEDPRO CLINIC | ลงทะเบียนบัตรเวชระเบียนออนไลน์</p>
    </div>

    <form id="registForm" onsubmit="handleFormSubmit(event)">
        
        <!-- ข้อมูลส่วนตัวหลัก -->
        <div class="form-section">
            <h3><i class="fas fa-user"></i> 1. ข้อมูลประจำตัวและประวัติส่วนตัว</h3>
            <div class="form-grid">
                <div class="form-group col-4 required">
                    <label for="idCard">เลขบัตรประจำตัวประชาชน (13 หลัก):</label>
                    <input type="text" id="idCard" maxlength="13" placeholder="ป้อนเลข 13 หลัก" required>
                </div>
                <div class="form-group col-2 required">
                    <label for="title">คำนำหน้าชื่อ/ยศ:</label>
                    <select id="title" required onchange="validateGenderTitleMismatch()">
                        <option value="">--เลือก--</option>
                        <option value="นาย">นาย</option>
                        <option value="นาง">นาง</option>
                        <option value="นางสาว">นางสาว</option>
                        <option value="เด็กชาย">เด็กชาย</option>
                        <option value="เด็กหญิง">เด็กหญิง</option>
                        <option value="พระภิกษุ">พระภิกษุ</option>
                        <option value="นายแพทย์">นายแพทย์</option>
                        <option value="พญ.">พญ.</option>
                    </select>
                </div>
                <div class="form-group col-3 required">
                    <label for="name">ชื่อตัว:</label>
                    <input type="text" id="name" placeholder="ชื่อจริง" required>
                </div>
                <div class="form-group col-3 required">
                    <label for="surname">นามสกุล:</label>
                    <input type="text" id="surname" placeholder="นามสกุล" required>
                </div>

                <div class="form-group col-2 required">
                    <label for="gender">เพศสภาพ:</label>
                    <select id="gender" required onchange="validateGenderTitleMismatch()">
                        <option value="">--เลือก--</option>
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                        <option value="อื่น ๆ">อื่น ๆ</option>
                    </select>
                    <div class="warning-toast" id="genderTitleWarning"></div>
                </div>

                <div class="form-group col-3 required">
                    <label for="dob">วันเดือนปีเกิด:</label>
                    <input type="text" id="dob" placeholder="วว/ดด/ปปปป (พ.ศ.)" required onblur="calculateAgeFromDob(this.value)">
                </div>

                <div class="form-group col-3">
                    <label for="ageInput">หรือระบุอายุ (ปี) หากไม่ทราบวันเกิด:</label>
                    <input type="number" id="ageInput" min="0" max="150" placeholder="อายุ" oninput="calculateDobFromAge(this.value)">
                    <div class="warning-toast" id="ageLimitWarning"></div>
                </div>

                <div class="form-group col-2">
                    <label for="bloodGroup">หมู่โลหิต:</label>
                    <select id="bloodGroup">
                        <option value="ไม่ทราบ">ไม่ทราบ</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="AB">AB</option>
                        <option value="O">O</option>
                    </select>
                </div>

                <div class="form-group col-2">
                    <label for="marital">สถานภาพสมรส:</label>
                    <select id="marital">
                        <option value="โสด">โสด</option>
                        <option value="สมรส">สมรส</option>
                        <option value="หย่าร้าง">หย่าร้าง</option>
                        <option value="หม้าย">หม้าย</option>
                    </select>
                </div>

                <div class="form-group col-3">
                    <label for="nationality">สัญชาติ/เชื้อชาติ:</label>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="nationality" value="ไทย">
                        <input type="text" id="ethnicity" value="ไทย">
                    </div>
                </div>
                <div class="form-group col-3">
                    <label for="religion">ศาสนา:</label>
                    <input type="text" id="religion" value="พุทธ">
                </div>
                <div class="form-group col-3">
                    <label for="occupation">อาชีพ:</label>
                    <input type="text" id="occupation" placeholder="เช่น รับจ้าง ค้าขาย">
                </div>
                <div class="form-group col-3 required">
                    <label for="rights">สิทธิ์การรักษาพื้นฐาน:</label>
                    <select id="rights" required>
                        <option value="ชำระเงินเอง">ชำระเงินเอง</option>
                        <option value="ประกันสังคม">ประกันสังคม</option>
                        <option value="บัตรทอง (30 บาท)" selected>บัตรทอง (30 บาท)</option>
                        <option value="กรมบัญชีกลาง">กรมบัญชีกลาง / ข้าราชการ</option>
                        <option value="ประกันสุขภาพเอกชน">ประกันสุขภาพเอกชน</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ที่อยู่และติดต่อ -->
        <div class="form-section">
            <h3><i class="fas fa-map-marker-alt"></i> 2. ที่อยู่ปัจจุบันและการติดต่อ</h3>
            <div class="form-grid">
                <div class="form-group col-8 required">
                    <label for="address">ที่อยู่ปัจจุบัน (บ้านเลขที่ หมู่ ตรอก ซอย ถนน ตำบล อำเภอ จังหวัด):</label>
                    <input type="text" id="address" placeholder="12/3 หมู่ 1 ต.วังสามหมอ อ.วังสามหมอ จ.อุดรธานี" required>
                </div>
                <div class="form-group col-4 required">
                    <label for="zipcode">รหัสไปรษณีย์:</label>
                    <input type="text" id="zipcode" placeholder="41280" required>
                </div>

                <div class="form-group col-6 required">
                    <label for="phone">หมายเลขโทรศัพท์มือถือ:</label>
                    <input type="tel" id="phone" placeholder="08x-xxx-xxxx" required>
                </div>
                <div class="form-group col-6">
                    <label for="conditions">โรคประจำตัวเด่นชัด (ถ้ามี):</label>
                    <input type="text" id="conditions" placeholder="ถ้าไม่มีระบุว่า 'ไม่มี'">
                </div>
                <div class="form-group col-12">
                    <label for="allergy" style="color: var(--danger);">ประวัติการแพ้ยา (กรอกเป็นสีแดงเด่นชัด):</label>
                    <input type="text" id="allergy" style="color: var(--danger); font-weight: bold;" placeholder="ระบุชื่อยาที่แพ้ (ถ้ามี)">
                </div>
            </div>
        </div>

        <!-- ติดต่อกรณีฉุกเฉิน -->
        <div class="form-section" style="border-bottom: none; margin-bottom: 10px;">
            <h3><i class="fas fa-phone-alt"></i> 3. กรณีฉุกเฉินติดต่อครอบครัวหรือกู้ชีพ</h3>
            <div class="form-grid">
                <div class="form-group col-4 required">
                    <label for="emergencyContact">ชื่อ - นามสกุล ผู้ติดต่อฉุกเฉิน:</label>
                    <input type="text" id="emergencyContact" placeholder="ชื่อสกุลผู้ใกล้ชิด" required>
                </div>
                <div class="form-group col-4 required">
                    <label for="relationship">ความสัมพันธ์:</label>
                    <input type="text" id="relationship" placeholder="เช่น บิดา, มารดา, คู่สมรส, กู้ชีพ" required>
                </div>
                <div class="form-group col-4 required">
                    <label for="emergencyPhone">เบอร์โทรศัพท์ติดต่อ:</label>
                    <input type="tel" id="emergencyPhone" placeholder="08x-xxx-xxxx" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">💾 บันทึกและขอรหัสเวชระเบียน HN</button>
        <div id="statusMsg" class="status"></div>
    </form>

    <a href="/admin.html" class="link-admin"><i class="fas fa-lock"></i> ไปยังระบบหลังบ้านสำหรับเจ้าหน้าที่ (Admin Area)</a>
</div>

<script>
    // Checksum validation for Thai National ID (MOPH 1.5)
    function validateThaiID(id) {
        if (!/^[0-9]{13}$/.test(id)) return false;
        let sum = 0;
        for (let i = 0; i < 12; i++) {
            sum += parseInt(id.charAt(i)) * (13 - i);
        }
        let check = (11 - (sum % 11)) % 10;
        return check === parseInt(id.charAt(12));
    }

    // DOB age calculator (MOPH 1.2)
    function calculateAgeFromDob(dobVal) {
        const toast = document.getElementById('ageLimitWarning');
        toast.style.display = 'none';

        if (!dobVal.includes('/')) return;
        const parts = dobVal.split('/');
        if (parts.length !== 3) return;

        const yearBE = parseInt(parts[2]);
        const currentYearBE = new Date().getFullYear() + 543;
        const age = currentYearBE - yearBE;

        document.getElementById('ageInput').value = age;

        // Old age warning MOPH 1.3
        if (age > 120) {
            toast.style.display = 'block';
            toast.innerText = `⚠️ คำเตือน: อายุคนไข้สูงกว่าปกติ (${age} ปี) กรุณาตรวจสอบว่ากรอกปีเกิดถูกต้อง`;
        }
    }

    // Direct age converter to DOB MOPH 1.4
    function calculateDobFromAge(ageVal) {
        const age = parseInt(ageVal);
        if (isNaN(age) || age < 0) return;

        const currentYearBE = new Date().getFullYear() + 543;
        const estYearBE = currentYearBE - age;
        document.getElementById('dob').value = `00/00/${estYearBE}`;
    }

    // Mismatches title and gender warning MOPH 1.3
    function validateGenderTitleMismatch() {
        const title = document.getElementById('title').value;
        const gender = document.getElementById('gender').value;
        const toast = document.getElementById('genderTitleWarning');
        toast.style.display = 'none';

        if (!title || !gender) return;

        const maleTitles = ['นาย', 'เด็กชาย', 'พระภิกษุ', 'นายแพทย์'];
        const femaleTitles = ['นาง', 'นางสาว', 'เด็กหญิง', 'พญ.'];

        if (gender === 'หญิง' && maleTitles.includes(title)) {
            toast.style.display = 'block';
            toast.innerText = `⚠️ คำเตือน: เพศสิทธิระบุเป็นหญิง แต่เลือกคำนำหน้าเป็นชาย (${title})`;
        } else if (gender === 'ชาย' && femaleTitles.includes(title)) {
            toast.style.display = 'block';
            toast.innerText = `⚠️ คำเตือน: เพศสิทธิระบุเป็นชาย แต่เลือกคำนำหน้าเป็นหญิง (${title})`;
        }
    }

    // Form submit
    async function handleFormSubmit(e) {
        e.preventDefault();
        
        const idCard = document.getElementById('idCard').value.trim();
        const name = document.getElementById('name').value.trim();
        const surname = document.getElementById('surname').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!validateThaiID(idCard)) {
            alert('❌ เลขประจำตัวประชาชน 13 หลักของคนไข้ ไม่ถูกต้องตามหลักทะเบียนราษฎร์');
            return;
        }

        statusMsg.style.display = 'block';
        statusMsg.className = 'status';
        statusMsg.innerText = 'กำลังเชื่อมต่อและคัดกรองข้อมูลประวัติซ้ำซ้อน...';

        try {
            // Check duplicates MOPH 1.12 & 1.18
            const dupRes = await fetch('/api/register/check-duplicate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idCard, name, surname })
            });
            const dupResult = await dupRes.json();

            if (dupResult.success && dupResult.duplicate) {
                const dupPat = dupResult.patient;
                const verify = confirm(
                    `⚠️ ระบบเวชระเบียนตรวจพบสิทธิ์แฟ้ม HN เดิมซ้ำกัน:\n` +
                    `HN เดิม: ${dupPat.hn}\n` +
                    `ชื่อ-นามสกุล: ${dupPat.fullName}\n` +
                    `วันเกิดเดิม: ${dupPat.dob}\n` +
                    `เลขบัตรประชาชน: ${dupPat.idCard}\n\n` +
                    `คุณเป็นบุคคลคนเดียวกันกับแฟ้มประวัติเดิมนี้หรือไม่? หากใช่ กด 'ตกลง' เพื่อยุติการออกเลข HN ใหม่`
                );
                
                if (verify) {
                    statusMsg.innerText = `⚠️ ใช้เวชระเบียนเดิมรหัส: ${dupPat.hn} ในการรับบริการทางการแพทย์`;
                    statusMsg.classList.add('error');
                    return;
                }
            }

            // Register patient
            const patientData = {
                idCard: idCard,
                title: document.getElementById('title').value,
                name: name,
                surname: surname,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value + ' ' + document.getElementById('zipcode').value,
                rights: document.getElementById('rights').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                maritalStatus: document.getElementById('marital').value,
                religion: document.getElementById('religion').value,
                nationality: document.getElementById('nationality').value,
                ethnicity: document.getElementById('ethnicity').value,
                occupation: document.getElementById('occupation').value,
                emergencyContact: document.getElementById('emergencyContact').value,
                relationship: document.getElementById('relationship').value,
                emergencyPhone: document.getElementById('emergencyPhone').value,
                conditions: document.getElementById('conditions').value,
                allergy: document.getElementById('allergy').value,
                isConfidential: false,
                confidentialRole: 'staff',
                isDeceased: false
            };

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patientData)
            });
            const result = await res.json();

            if (result.success) {
                statusMsg.innerText = `✅ ลงทะเบียนเรียบร้อย! เลขเวชระเบียนใหม่ของคุณคือ HN: ${result.data.hn}`;
                statusMsg.classList.add('success');
                e.target.reset();
                
                setTimeout(() => {
                    if (confirm('ต้องการไปที่ห้องจัดการการตรวจรักษา/การเงินหรือไม่?')) {
                        window.location.href = '/admin.html';
                    }
                }, 1500);
            } else {
                statusMsg.innerText = '❌ เกิดความผิดพลาด: ' + result.message;
                statusMsg.classList.add('error');
            }
        } catch (err) {
            console.error(err);
            statusMsg.innerText = '❌ เกิดปัญหากลุ่มสัญญาณอินเทอร์เน็ตหลุด';
            statusMsg.classList.add('error');
        }
    }
</script>

</body>
</html>
